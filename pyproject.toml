# The Python half of this package: `pip install git+https://github.com/me-inn/pkg-leaf`
# gives `from leaf import Notice`, with the same generated classes a consumer
# can read under generated/python. Nothing here is written by hand except
# this file; generate.sh writes the package's __init__ along with the rest.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "me-inn-leaf"
version = "1.0.0"
description = "The shape of the data, declared once: generated Python types for the me-inn schemas."
requires-python = ">=3.9"
dependencies = ["python-dateutil>=2.8"]
license = { text = "MIT" }

[tool.setuptools]
packages = ["leaf"]
package-dir = { leaf = "generated/python" }
